name: Android CI (Build APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Android SDK install + licenses accept (সবচেয়ে জরুরি)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ Debug APK — কোনো keystore/secret ছাড়াও এটি অবশ্যই বিল্ড হবে
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # ---------- Release (Secrets থাকলে only) ----------
      - name: Check signing secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode Keystore
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/keystore.jks

      - name: Build Release APK
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk